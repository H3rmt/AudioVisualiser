[env]
monitor_port = /dev/ttyACM0
;monitor_speed = 921600
monitor_speed = 115200
extra_scripts =
    pre:load-env.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit NeoPixel@1.15.5
;    adafruit/Adafruit NeoPixel@1.12.0
    https://github.com/kosme/arduinoFFT.git

build_flags =
    -D FFT_SQRT_APPROXIMATION
;    -D RP2040_PIO_SPI

    -D USER_SETUP_LOADED=1
;    -D USE_HSPI_PORT
    -D ILI9341_DRIVER=1

    -D TFT_MISO=16
    -D TFT_MOSI=19
    -D TFT_SCLK=18

    -D TFT_DC=22
    -D TFT_CS=17
    -D TFT_RST=21

    -D TOUCH_CS=20

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=0
    -D LOAD_FONT7=0
    -D LOAD_FONT8=0
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=70000000
    -D SPI_READ_FREQUENCY=27000000
    -D SPI_TOUCH_FREQUENCY=2500000

;    -D WAIT_FOR_SERIAL
    -D TEST_LEDS
;    -D TIMING_WARN_ON_OVERLAP

;    -D CDEBUG

; Optimize for speed
    -O3
;-flto

build_unflags = -Os

[env:wired]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2350
board = rpipico2w
upload_protocol = picotool

[env:native]
platform = native
test_framework = unity
debug_test = *

